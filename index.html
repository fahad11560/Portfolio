<title>Mirza Fahad Baig — Flutter & AI Automation Developer</title>

<style>
  :root{--bg:#151312;--text:#FFFFFF;--muted:#998F8F;--accent:#F46C38;--surface:rgba(255,255,255,.03);--border:rgba(255,255,255,.1);}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px;}
  nav{position:fixed;top:20px;left:50%;transform:translateX(-50%);width:292px;height:48px;
    display:flex;align-items:center;justify-content:center;gap:18px;padding:0 20px;border-radius:16px;
    background:rgba(21,19,18,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);z-index:100;}
  nav a{font-size:12px;color:var(--muted);transition:color .2s;cursor:pointer;}
  nav a:hover,nav a.active{color:var(--text);}
  .layout{display:grid;grid-template-columns:280px 1fr;gap:40px;padding-top:110px;align-items:start;}
  aside{position:sticky;top:90px;display:flex;flex-direction:column;gap:20px;padding-bottom:40px;}
  .avatar-wrap{position:relative;padding-top:26px;}
  .avatar{width:100%;aspect-ratio:1/1.1;border-radius:16px;background:linear-gradient(150deg,var(--accent),#7a3013);
    display:flex;align-items:center;justify-content:center;border:1px solid var(--border);position:relative;}
  .avatar span{font-size:96px;font-weight:700;color:rgba(21,19,18,.35);}
  .avatar-badge{position:absolute;left:24px;bottom:-18px;width:36px;height:36px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);}
  .avatar-badge svg{width:16px;height:16px;stroke:#151312;}
  .id-card h1{font-size:24px;font-weight:600;margin:0 0 8px;}
  .id-card p{font-size:14px;line-height:1.6;color:var(--muted);margin:0;}
  .social-row{display:flex;gap:10px;margin-top:16px;}
  .social-row a{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent);transition:.2s;}
  .social-row a:hover{background:var(--accent);color:#151312;}
  .social-row svg{width:16px;height:16px;}
  main{min-width:0;}
  #view{animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){#view{animation:none;}}
  section{padding-top:100px;}
  section:first-of-type{padding-top:0;}
  h2.big{font-size:44px;font-weight:700;line-height:1.05;margin:0;letter-spacing:-.01em;}
  h2.big .fade2{color:var(--muted);opacity:.5;display:block;}
  p.lede{font-size:16px;color:var(--muted);line-height:1.7;max-width:480px;margin:20px 0 0;}
  .stat-row{display:flex;gap:36px;margin-top:44px;flex-wrap:wrap;}
  .stat-row div h3{font-size:32px;font-weight:700;margin:0 0 4px;color:var(--accent);}
  .stat-row div span{font-size:12px;color:var(--muted);}
  .tile-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px;}
  .tile{border-radius:16px;padding:24px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;
    transition:transform .28s ease,box-shadow .28s ease,filter .28s ease,background .28s ease,border-color .28s ease;}
  .tile.fill{background:var(--accent);color:#151312;}
  .tile.outline{background:var(--surface);border:1px solid var(--border);}
  .tile:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 14px 34px rgba(0,0,0,.35);}
  .tile.fill:hover{filter:brightness(1.07);}
  .tile.outline:hover{border-color:var(--accent);background:rgba(244,108,56,.07);}
  .tile:active{transform:translateY(-1px) scale(.99);}
  @media(prefers-reduced-motion:reduce){.tile{transition:none;}.tile:hover{transform:none;}}
  .tile h4{font-size:15px;font-weight:600;line-height:1.4;margin:0;}
  .tile-icon{transition:transform .3s ease;}
  .tile:hover .tile-icon{transform:scale(1.12) rotate(-5deg);}
  .tile-arrow{align-self:flex-end;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:transform .28s ease;}
  .tile.fill .tile-arrow{background:rgba(21,19,18,.15);}
  .tile.outline .tile-arrow{background:rgba(255,255,255,.06);}
  .tile:hover .tile-arrow{transform:translate(3px,-3px);}
  .tile svg{width:16px;height:16px;}
  h2.section-head{font-size:26px;font-weight:600;margin:0 0 8px;}
  p.section-sub{color:var(--muted);font-size:14px;margin:0 0 32px;}
  .proj-row{display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:padding-left .2s;}
  .proj-row:hover{padding-left:6px;}
  .proj-row:last-child{border-bottom:none;}
  .proj-thumb{width:64px;height:64px;border-radius:10px;background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:20px;flex-shrink:0;}
  .proj-info{flex:1;min-width:0;}
  .proj-info h4{font-size:16px;font-weight:600;margin:0 0 4px;}
  .proj-info span{font-size:12px;color:var(--muted);}
  .proj-link{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;}
  .proj-row:hover .proj-link{background:var(--accent);border-color:var(--accent);}
  .proj-link svg{width:14px;height:14px;}
  .proj-row .featured-badge{font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--accent);background:rgba(244,108,56,.12);border:1px solid rgba(244,108,56,.35);border-radius:6px;padding:3px 8px;flex-shrink:0;}
  .proj-row.featured{border-color:rgba(244,108,56,.3);}
  .subhead{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:0 0 4px;}
  .subhead.featured-subhead{color:var(--accent);}
  .proj-group{margin-bottom:8px;}
  .proj-group + .proj-group{margin-top:32px;}
  .exp-entry{padding:22px 0;}
  .exp-entry h4{font-size:16px;font-weight:600;margin:0 0 6px;}
  .exp-entry span{font-size:12px;color:var(--muted);}
  .exp-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .exp-list li{font-size:14px;color:var(--muted);padding-left:16px;position:relative;}
  .exp-list li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .tool-item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
    opacity:0;transform:translateY(10px);animation:toolIn .5s ease forwards;transition:border-color .25s,background .25s,transform .25s;}
  .tool-item:hover{border-color:var(--accent);background:rgba(244,108,56,.06);transform:translateY(-2px);}
  @keyframes toolIn{to{opacity:1;transform:translateY(0);}}
  @media(prefers-reduced-motion:reduce){.tool-item{animation:none;opacity:1;transform:none;}}
  .tool-icon{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .3s ease,background .3s ease;}
  .tool-icon svg{width:22px;height:22px;}
  .tool-item:hover .tool-icon{transform:scale(1.14) rotate(-5deg);background:rgba(255,255,255,.12);}
  .tool-item h5{font-size:14px;font-weight:500;margin:0;}
  .tool-item span{font-size:11px;color:var(--muted);}
  .btn-whatsapp{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:13px 22px;border-radius:8px;
    background:#25D366;color:#0b1a10;font-size:14px;font-weight:600;transition:transform .2s ease,filter .2s ease;}
  .btn-whatsapp:hover{transform:translateY(-2px);filter:brightness(1.05);}
  form{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:36px;}
  .field{display:flex;flex-direction:column;gap:8px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12px;color:var(--muted);}
  .field input,.field textarea{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--text);font-family:inherit;font-size:14px;resize:none;}
  .field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  button.submit{grid-column:1/-1;background:var(--accent);color:#151312;border:none;border-radius:8px;padding:16px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .2s;}
  button.submit:hover{transform:translateY(-2px);}
  button.submit:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  #contact-form .status{font-size:13px;color:var(--muted);margin:0;}
  #contact-form .status.err{color:#F46C38;}
  #contact-form .status.ok{color:#3ECF8E;}
  footer{padding:60px 0 40px;border-top:1px solid var(--border);margin-top:100px;}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  footer p{color:var(--muted);font-size:12px;margin:0;}
  .back-link{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:28px;cursor:pointer;}
  .back-link:hover{color:var(--accent);}
  .back-link svg{width:14px;height:14px;}
  .p-head span.tag{display:inline-block;font-size:11px;color:var(--accent);border:1px solid var(--border);border-radius:6px;padding:5px 10px;margin-bottom:16px;}
  .p-head h1{font-size:42px;font-weight:700;margin:0 0 12px;line-height:1.1;}
  .p-head p{font-size:15px;color:var(--muted);max-width:520px;line-height:1.7;margin:0 0 28px;}
  .p-links{display:flex;gap:12px;margin-bottom:48px;flex-wrap:wrap;}
  .p-btn{padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid var(--border);}
  .p-btn.primary{background:var(--accent);color:#151312;border-color:var(--accent);font-weight:600;}
  .p-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px;}
  .p-shot{aspect-ratio:16/10;border-radius:12px;border:1px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11px;overflow:hidden;}
  .p-shot img{width:100%;height:100%;object-fit:cover;}
  .p-shot svg{width:22px;height:22px;opacity:.5;}
  .p-note{font-size:12px;color:var(--muted);margin:0 0 48px;}
  .p-video{aspect-ratio:16/9;border-radius:12px;border:1px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:48px;overflow:hidden;}
  .p-video svg{width:34px;height:34px;opacity:.6;}
  .p-video iframe,.p-video video{width:100%;height:100%;border:0;}
  .p-2col{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-bottom:48px;}
  .p-2col h3{font-size:18px;font-weight:600;margin:0 0 16px;}
  .p-stack{display:flex;flex-wrap:wrap;gap:8px;}
  .p-stack span{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--text);}
  .p-feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .p-feat li{font-size:14px;color:var(--muted);padding-left:18px;position:relative;line-height:1.5;}
  .p-feat li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .p-nav{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:28px;font-size:14px;}
  .p-nav a{color:var(--muted);}
  .p-nav a:hover{color:var(--accent);}
  @media(max-width:860px){
    .layout{grid-template-columns:1fr;}
    aside{position:static;}
    .avatar{max-width:220px;margin:0 auto;}
    h2.big,.p-head h1{font-size:32px;}
    .tile-row,.tools-grid,form,.p-2col{grid-template-columns:1fr;}
    .p-gallery{grid-template-columns:1fr 1fr;}
    nav{width:calc(100% - 40px);}
  }
</style>

async function loadContent(){
  if(!sb) return;
  try{
    const [pRes,eRes,sRes]=await Promise.all([
      sb.from('projects').select('*').order('sort_order',{ascending:true}),
      sb.from('experience').select('*').order('sort_order',{ascending:true}),
      sb.from('skills').select('*').order('sort_order',{ascending:true})
    ]);
    if(!pRes.error && pRes.data && pRes.data.length) PROJECTS=pRes.data;
    if(!eRes.error && eRes.data && eRes.data.length) EXPERIENCE=eRes.data;
    if(!sRes.error && sRes.data && sRes.data.length) SKILLS=sRes.data;
    currentMode=null; // force a rebuild so freshly-loaded content actually appears
    render();
  }catch(e){ console.warn('Could not load live content, using defaults', e); }
}

function videoEmbedHtml(url){
  const yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{11})/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe>`;
  const vm=url.match(/vimeo\.com\/(\d+)/);
  if(vm) return `<iframe src="https://player.vimeo.com/video/${vm[1]}" allowfullscreen></iframe>`;
  return `<video controls src="${url}"></video>`;
}

async function loadProjectMedia(id){
  if(!sb) return;
  try{
    const {data,error}=await sb.from('project_media').select('screenshots,video_url').eq('project_id',id).maybeSingle();
    if(error||!data) return;
    const gallery=document.getElementById('p-gallery');
    if(gallery && Array.isArray(data.screenshots) && data.screenshots.length){
      gallery.innerHTML=data.screenshots.map(s=>`<a class="p-shot" href="${s.url}" target="_blank" rel="noopener" style="border-style:solid;padding:0;"><img src="${s.url}" alt="Screenshot"></a>`).join('');
    }
    const videoBox=document.getElementById('p-video');
    if(videoBox && data.video_url){
      videoBox.style.borderStyle='solid';
      videoBox.style.padding='0';
      videoBox.innerHTML=videoEmbedHtml(data.video_url);
    }
  }catch(e){ console.warn('Could not load project media', e); }
}

document.addEventListener('submit', async (e)=>{
  if(!e.target || e.target.id!=='contact-form') return;
  e.preventDefault();
  const form=e.target;
  const statusEl=document.getElementById('cf-status');
  const btn=document.getElementById('cf-submit');
  const honey=form.querySelector('[name="_honey"]').value;
  if(honey) return; // silently drop bot submissions
  const name=document.getElementById('cf-name').value.trim();
  const email=document.getElementById('cf-email').value.trim();
  const message=document.getElementById('cf-message').value.trim();
  if(!name||!email||!message){ statusEl.textContent='Please fill in all fields.'; statusEl.className='status err'; return; }

  btn.disabled=true; statusEl.textContent='Sending...'; statusEl.className='status';
  let emailOk=false;
  try{
    const res=await fetch('https://formsubmit.co/ajax/fahadmirza2000@gmail.com',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({ name, email, message, _subject:`Portfolio message from ${name}`, _captcha:'false' })
    });
    emailOk=res.ok;
  }catch(err){ console.warn('Email send failed', err); }

  let sheetOk=false;
  try{
    if(typeof GOOGLE_SHEETS_URL!=='undefined' && GOOGLE_SHEETS_URL && GOOGLE_SHEETS_URL!=='YOUR_APPS_SCRIPT_WEB_APP_URL'){
      const res=await fetch(GOOGLE_SHEETS_URL,{
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids a CORS preflight Apps Script can't handle
        body:JSON.stringify({ name, email, message })
      });
      const json=await res.json();
      sheetOk = json && json.status==='ok';
    }
  }catch(err){ console.warn('Could not log message to Google Sheets', err); }

  btn.disabled=false;
  if(emailOk||sheetOk){
    statusEl.textContent="Thanks — I'll get back to you soon.";
    statusEl.className='status ok';
    form.reset();
  }else{
    statusEl.textContent='Something went wrong sending that. Try WhatsApp instead, or email me directly.';
    statusEl.className='status err';
  }
});

let currentMode=null; // 'home' | 'project' — tracks what's actually in #view right now
function scrollToHash(h){
  if(!h || h==='#'){ window.scrollTo({top:0,behavior:'smooth'}); return; }
  const el=document.getElementById(h.replace('#/',''));
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  else window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  const h=location.hash;
  const view=document.getElementById('view');

  if(h.startsWith('#/project/')){
    const id=h.replace('#/project/','');
    view.style.opacity=0;
    requestAnimationFrame(()=>{
      view.innerHTML=projectView(id);
      void view.offsetWidth;
      view.style.opacity=1;
      window.scrollTo({top:0,behavior:'instant'});
      loadProjectMedia(id);
    });
    currentMode='project';
    return;
  }

  if(h.startsWith('#/domain/')){
    const key=h.replace('#/domain/','');
    view.style.opacity=0;
    requestAnimationFrame(()=>{
      view.innerHTML=domainView(key);
      void view.offsetWidth;
      view.style.opacity=1;
      window.scrollTo({top:0,behavior:'instant'});
    });
    currentMode='domain';
    return;
  }

  if(currentMode==='home'){
    // Home is already on screen — just scroll to the section, no rebuild, no jump.
    scrollToHash(h);
    return;
  }

  // First load, or coming back from a project page — home isn't in the DOM yet.
  view.style.opacity=0;
  requestAnimationFrame(()=>{
    view.innerHTML=homeView();
    void view.offsetWidth;
    view.style.opacity=1;
    currentMode='home';
    requestAnimationFrame(()=>scrollToHash(h));
  });
}
window.addEventListener('hashchange',render);
render();
loadContent();
